<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kpi.smougroup — إدخال بيانات العملاء</title>

  <style>
    :root{
      --glass: rgba(255,255,255,.12);
      --glass2: rgba(255,255,255,.18);
      --border: rgba(255,255,255,.25);
      --text:#ffffff;
      --muted: rgba(255,255,255,.82);
      --shadow: 0 18px 55px rgba(0,0,0,.40);
      --accent: rgba(40,150,255,.65);
      --accent2: rgba(17,120,214,.40);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial;
      color: var(--text);
      min-height:100vh;
      background:
        url("back.png") center/cover no-repeat fixed,
        url("back.jpg") center/cover no-repeat fixed,
        radial-gradient(1200px 800px at 30% 10%, rgba(40,150,255,.28), transparent 60%),
        linear-gradient(180deg, #071c33, #0b1b2b);
    }

    .overlay{
      min-height:100vh;
      padding:26px 14px 40px;
      background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.45));
    }

    .wrap{max-width:1150px;margin:0 auto}

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; flex-wrap:wrap;
      margin-bottom:14px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      padding:12px 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .brand img{
      width:44px; height:44px; object-fit:contain;
      background: rgba(255,255,255,.85);
      border-radius: 12px;
      padding:6px;
    }
    .brand .txt{line-height:1.15}
    .brand .txt b{display:block;font-size:14px}
    .brand .txt span{font-size:12px;color:var(--muted)}

    .actions{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .btn{
      border:1px solid var(--border);
      background: linear-gradient(180deg, var(--glass2), rgba(255,255,255,.08));
      color:var(--text);
      padding:10px 12px;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: 0 12px 26px rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
      display:inline-flex; align-items:center; gap:8px;
      font-weight:700;
    }
    .btn:hover{transform: translateY(-1px)}
    .btn.primary{
      border-color: rgba(40,150,255,.75);
      background: linear-gradient(180deg, rgba(40,150,255,.40), rgba(255,255,255,.10));
    }
    .btn.danger{
      border-color: rgba(255,90,90,.55);
      background: linear-gradient(180deg, rgba(255,90,90,.28), rgba(255,255,255,.08));
    }

    .card{
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow:hidden;
    }

    .card-h{
      padding:14px 16px;
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; flex-wrap:wrap;
      border-bottom: 1px solid rgba(255,255,255,.18);
    }
    .card-h h1{
      margin:0;
      font-size:16px;
      letter-spacing:.2px;
    }
    .card-h .meta{
      display:flex; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:12px;
      align-items:center;
    }
    .pill{
      border:1px solid rgba(255,255,255,.22);
      background: rgba(0,0,0,.12);
      padding:6px 10px;
      border-radius:999px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
      padding:16px;
    }
    .field{
      grid-column: span 6;
      display:flex; flex-direction:column; gap:7px;
    }
    .field.small{grid-column: span 4;}
    .field.full{grid-column: span 12;}
    label{font-size:12px;color:var(--muted)}
    input, select, textarea{
      width:100%;
      padding:12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.10);
      color: var(--text);
      outline: none;
      backdrop-filter: blur(10px);
    }
    input::placeholder, textarea::placeholder{color: rgba(255,255,255,.65)}
    textarea{min-height:90px; resize: vertical}

    .form-actions{
      padding:0 16px 16px;
      display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-start;
    }

    .table-wrap{padding:0 16px 16px; overflow:auto}
    table{
      width:100%;
      border-collapse: collapse;
      min-width: 980px;
      background: rgba(0,0,0,.12);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      overflow:hidden;
    }
    th, td{
      padding:10px 10px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      vertical-align: top;
      font-size: 12.5px;
    }
    th{
      text-align:right;
      background: rgba(255,255,255,.10);
      color: var(--muted);
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(10px);
    }
    tr:hover td{background: rgba(255,255,255,.06)}
    td .rowbtn{
      padding:8px 10px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      color:#fff;
      cursor:pointer;
      font-weight:700;
    }
    td .rowbtn.del{
      border-color: rgba(255,90,90,.55);
      background: rgba(255,90,90,.18);
    }

    .bottom{
      margin-top:14px;
      display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
      color: rgba(255,255,255,.7);
      font-size: 12px;
      padding: 0 4px;
    }

    .search{
      width:min(420px, 100%);
    }

    @media (max-width: 820px){
      .field{grid-column: span 12;}
      table{min-width: 980px;}
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="wrap">

      <div class="topbar">
        <div class="brand">
          <img src="logo.png" alt="SMOU GROUP Logo" onerror="this.style.display='none'">
          <div class="txt">
            <b>kpi.smougroup</b>
            <span>نموذج إدخال بيانات العملاء (CRM Action)</span>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" id="btnExport">تصدير CSV</button>
          <label class="btn" for="fileImport" style="cursor:pointer">استيراد CSV</label>
          <input id="fileImport" type="file" accept=".csv" style="display:none">
          <button class="btn danger" id="btnClearAll">مسح الكل</button>
        </div>
      </div>

      <div class="card">
        <div class="card-h">
          <h1>إضافة / تعديل سجل</h1>
          <div class="meta">
            <span class="pill">عدد السجلات: <b id="count">0</b></span>
            <input class="search" id="q" placeholder="بحث سريع: اسم العميل / التلفون / اللوحة / الاستشاري / المقاول / الأكشن">
          </div>
        </div>

        <form id="form">
          <div class="grid">
            <div class="field">
              <label>اسم العميل</label>
              <input id="clientName" placeholder="مثال: أحمد محمد" required>
            </div>

            <div class="field">
              <label>رقم اللوحة</label>
              <input id="plateNo" placeholder="مثال: A 12345">
            </div>

            <div class="field small">
              <label>رقم التلفون</label>
              <input id="phone" placeholder="مثال: 0501234567" inputmode="tel">
            </div>

            <div class="field small">
              <label>اسم الاستشاري</label>
              <input id="consultant" placeholder="مثال: مكتب XYZ">
            </div>

            <div class="field small">
              <label>اسم المقاول</label>
              <input id="contractor" placeholder="مثال: شركة ABC">
            </div>

            <div class="field">
              <label>الأكشن</label>
              <select id="action" required>
                <option value="" disabled selected>اختر...</option>
                <option>مقابلة</option>
                <option>معاينة</option>
                <option>عرض سعر</option>
                <option>عقد مبدئي</option>
              </select>
            </div>

            <div class="field full">
              <label>ملاحظات</label>
              <textarea id="notes" placeholder="اكتب أي تفاصيل مهمة..."></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn primary" type="submit" id="btnSave">حفظ السجل</button>
            <button class="btn" type="button" id="btnReset">تفريغ الحقول</button>
            <span class="pill" id="editHint" style="display:none">وضع التعديل مفعل</span>
          </div>
        </form>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>التاريخ</th>
                <th>اسم العميل</th>
                <th>رقم اللوحة</th>
                <th>رقم التلفون</th>
                <th>الاستشاري</th>
                <th>المقاول</th>
                <th>الأكشن</th>
                <th>ملاحظات</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="bottom">
        <div>© SMOU GROUP — KPI / CRM</div>
        <div>يحفظ البيانات محلياً على نفس الجهاز والمتصفح.</div>
      </div>

    </div>
  </div>

<script>
  // ===== Storage Keys =====
  const STORAGE_KEY = "kpi_smougroup_clients_v1";

  // ===== Elements =====
  const form = document.getElementById("form");
  const clientName = document.getElementById("clientName");
  const plateNo = document.getElementById("plateNo");
  const phone = document.getElementById("phone");
  const consultant = document.getElementById("consultant");
  const contractor = document.getElementById("contractor");
  const action = document.getElementById("action");
  const notes = document.getElementById("notes");
  const tbody = document.getElementById("tbody");
  const countEl = document.getElementById("count");
  const q = document.getElementById("q");
  const editHint = document.getElementById("editHint");

  const btnReset = document.getElementById("btnReset");
  const btnClearAll = document.getElementById("btnClearAll");
  const btnExport = document.getElementById("btnExport");
  const fileImport = document.getElementById("fileImport");

  // ===== Data =====
  let rows = load();
  let editId = null;

  // ===== Helpers =====
  function nowStr(){
    const d = new Date();
    // YYYY-MM-DD HH:MM
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
  }

  function uid(){
    // simple unique id
    return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      return [];
    }
  }

  function esc(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function resetForm(){
    form.reset();
    notes.value = "";
    editId = null;
    editHint.style.display = "none";
  }

  function filteredRows(){
    const term = (q.value || "").trim().toLowerCase();
    if(!term) return rows;
    return rows.filter(r => {
      const hay = [
        r.date, r.clientName, r.plateNo, r.phone,
        r.consultant, r.contractor, r.action, r.notes
      ].join(" ").toLowerCase();
      return hay.includes(term);
    });
  }

  function render(){
    const data = filteredRows();
    countEl.textContent = rows.length;

    tbody.innerHTML = data.map((r, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${esc(r.date)}</td>
        <td>${esc(r.clientName)}</td>
        <td>${esc(r.plateNo)}</td>
        <td>${esc(r.phone)}</td>
        <td>${esc(r.consultant)}</td>
        <td>${esc(r.contractor)}</td>
        <td>${esc(r.action)}</td>
        <td style="max-width:320px; white-space:pre-wrap">${esc(r.notes)}</td>
        <td style="white-space:nowrap">
          <button class="rowbtn" onclick="editRow('${r.id}')">تعديل</button>
          <button class="rowbtn del" onclick="deleteRow('${r.id}')">حذف</button>
        </td>
      </tr>
    `).join("");

    if(!tbody.innerHTML){
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;color:rgba(255,255,255,.75);padding:18px">
        لا توجد نتائج
      </td></tr>`;
    }
  }

  // ===== Row Actions (Expose to window for onclick) =====
  window.editRow = function(id){
    const r = rows.find(x => x.id === id);
    if(!r) return;

    editId = id;
    clientName.value = r.clientName || "";
    plateNo.value = r.plateNo || "";
    phone.value = r.phone || "";
    consultant.value = r.consultant || "";
    contractor.value = r.contractor || "";
    action.value = r.action || "";
    notes.value = r.notes || "";

    editHint.style.display = "inline-flex";
    window.scrollTo({top: 0, behavior: "smooth"});
  };

  window.deleteRow = function(id){
    if(!confirm("تأكيد حذف السجل؟")) return;
    rows = rows.filter(x => x.id !== id);
    save();
    render();
    if(editId === id) resetForm();
  };

  // ===== Form Submit =====
  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const payload = {
      id: editId || uid(),
      date: editId ? (rows.find(x => x.id===editId)?.date || nowStr()) : nowStr(),
      clientName: clientName.value.trim(),
      plateNo: plateNo.value.trim(),
      phone: phone.value.trim(),
      consultant: consultant.value.trim(),
      contractor: contractor.value.trim(),
      action: action.value,
      notes: notes.value.trim()
    };

    if(!payload.clientName || !payload.action){
      alert("رجاءً أدخل اسم العميل واختر الأكشن.");
      return;
    }

    if(editId){
      rows = rows.map(x => x.id === editId ? payload : x);
    }else{
      rows.unshift(payload); // newest on top
    }

    save();
    resetForm();
    render();
  });

  btnReset.addEventListener("click", resetForm);

  btnClearAll.addEventListener("click", () => {
    if(!confirm("تحذير: سيتم مسح كل البيانات المحفوظة على هذا الجهاز. هل أنت متأكد؟")) return;
    rows = [];
    save();
    resetForm();
    render();
  });

  q.addEventListener("input", render);

  // ===== CSV Export / Import =====
  function toCSV(arr){
    const header = ["date","clientName","plateNo","phone","consultant","contractor","action","notes"];
    const lines = [header.join(",")];

    for(const r of arr){
      const row = header.map(k => {
        const v = String(r[k] ?? "");
        // CSV escape
        if(v.includes('"') || v.includes(",") || v.includes("\n")){
          return `"${v.replaceAll('"','""')}"`;
        }
        return v;
      }).join(",");
      lines.push(row);
    }
    return lines.join("\n");
  }

  btnExport.addEventListener("click", () => {
    const csv = toCSV(rows);
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `kpi_smougroup_clients_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  function parseCSV(text){
    // simple CSV parser (handles quoted cells)
    const rows = [];
    let i = 0, cell = "", row = [], inQuotes = false;

    function pushCell(){
      row.push(cell);
      cell = "";
    }
    function pushRow(){
      rows.push(row);
      row = [];
    }

    while(i < text.length){
      const ch = text[i];

      if(inQuotes){
        if(ch === '"' && text[i+1] === '"'){ // escaped quote
          cell += '"'; i += 2; continue;
        }
        if(ch === '"'){ inQuotes = false; i++; continue; }
        cell += ch; i++; continue;
      }else{
        if(ch === '"'){ inQuotes = true; i++; continue; }
        if(ch === ","){ pushCell(); i++; continue; }
        if(ch === "\n"){
          pushCell(); pushRow(); i++; continue;
        }
        if(ch === "\r"){ i++; continue; }
        cell += ch; i++; continue;
      }
    }
    // last cell
    pushCell();
    pushRow();
    return rows;
  }

  fileImport.addEventListener("change", async () => {
    const file = fileImport.files?.[0];
    if(!file) return;

    const text = await file.text();
    const parsed = parseCSV(text);
    if(parsed.length < 2){
      alert("ملف CSV غير صالح.");
      fileImport.value = "";
      return;
    }

    const header = parsed[0].map(h => (h||"").trim());
    const idx = (name) => header.indexOf(name);

    const required = ["date","clientName","plateNo","phone","consultant","contractor","action","notes"];
    const missing = required.filter(k => idx(k) === -1);
    if(missing.length){
      alert("CSV لازم يحتوي الأعمدة التالية:\n" + required.join(", "));
      fileImport.value = "";
      return;
    }

    const imported = [];
    for(let r=1; r<parsed.length; r++){
      const line = parsed[r];
      if(line.every(x => (x||"").trim()==="")) continue;

      imported.push({
        id: uid(),
        date: (line[idx("date")]||"").trim() || nowStr(),
        clientName: (line[idx("clientName")]||"").trim(),
        plateNo: (line[idx("plateNo")]||"").trim(),
        phone: (line[idx("phone")]||"").trim(),
        consultant: (line[idx("consultant")]||"").trim(),
        contractor: (line[idx("contractor")]||"").trim(),
        action: (line[idx("action")]||"").trim(),
        notes: (line[idx("notes")]||"").trim(),
      });
    }

    if(!imported.length){
      alert("لا توجد بيانات للاستيراد.");
      fileImport.value = "";
      return;
    }

    const mode = confirm("هل تريد دمج البيانات (OK) أم استبدال الكل (Cancel = استبدال)؟");
    if(mode){
      rows = [...imported, ...rows]; // merge, imported on top
    }else{
      rows = imported; // replace
    }

    save();
    render();
    fileImport.value = "";
    alert("تم الاستيراد بنجاح ✅");
  });

  // ===== Init =====
  render();
</script>
</body>
</html>
