<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KPI - SMOU Group</title>

  <style>
    :root{
      --bg:#ffffff;
      --btn:#0b0b0b;
      --btn2:#1a1a1a;
      --txt:#ffffff;
    }
    body{
      margin:0;
      font-family: Arial, Tahoma, sans-serif;
      background:var(--bg);
      display:flex;
      min-height:100vh;
      align-items:center;
      justify-content:center;
    }
    .wrap{
      width:min(900px, 92vw);
      text-align:center;
    }
    .row{
      display:flex;
      gap:28px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:28px;
    }
    .btn{
      width:320px;
      max-width:92vw;
      height:76px;
      border:none;
      border-radius:0;
      cursor:pointer;
      background:linear-gradient(180deg,var(--btn2),var(--btn));
      color:var(--txt);
      font-size:20px;
      letter-spacing:1px;
      transition:transform .08s ease, opacity .2s ease;
    }
    .btn:hover{ opacity:.92; }
    .btn:active{ transform:scale(.99); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="row">
      <button class="btn" onclick="go('https://kpi-abudhabi.smougroup.com/')">KPI - ABUDHABI</button>
      <button class="btn" onclick="go('https://kpi-dubai.smougroup.com/')">KPI - DUBAI</button>
    </div>

    <div>
      <button class="btn" style="width:420px" onclick="go('https://kpi-leader.smougroup.com/')">
        KPI - TEAM LEADER
      </button>
    </div>
  </div>

  <script>
    function go(url){
      window.location.href = url;
    }
  </script>
</body>
</html>
